name: Docker

# The full Docker suites take 5-8 minutes, so they run outside the pull request path: on pushes,
# weekly, by hand, and on pull requests that change how the images or the development stack are
# built. Every pull request still gets the Docker smoke job in ci.yml.
on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - "compose*.yaml"
      - .node-version
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
      - "**/tsconfig*.json"
      - "apps/*/next.config.*"
      - "apps/*/postcss.config.*"
      - "scripts/dev-*.mjs"
      - scripts/stack-image-size.mjs
      - scripts/test-stack.mjs
      - playwright.stack.config.ts
      - "tests/stack/**"
      # demo:start
      - scripts/build-mcp-apps.mjs
      - scripts/remove-demo.mjs
      # demo:end
      - ".github/actions/**"
      - .github/workflows/docker.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  stack:
    name: Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: true
          compose: true
      - run: pnpm test:stack
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-results
          path: test-results/stack
          if-no-files-found: ignore
          retention-days: 7

  # demo:start
  # Proves that a project without the demo stays green, browsers and Docker included.
  # pnpm remove-demo deletes this job together with the demo.
  demo-removal:
    name: Demo removal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: true
          compose: true
      # The command does not commit, so the job needs no Git identity.
      - run: pnpm remove-demo
      - run: pnpm verify
      - run: pnpm test:stack
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-removal-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
  # demo:end
