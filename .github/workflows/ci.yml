name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly dependency audit, also when nobody pushes.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

# The full Docker suites run in docker.yml.
jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level high

  verify:
    name: Verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: true
      - run: pnpm verify
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # demo:start
  # Proves on every pull request that a project without the demo still checks, tests and builds.
  # The Docker workflow repeats it with the browser and Docker suites.
  # pnpm remove-demo deletes this job together with the demo.
  demo-removal-quick:
    name: Demo removal (quick)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # It runs install, fix, check and test itself. It does not commit, so no Git identity.
      - run: pnpm remove-demo
      - run: pnpm build
  # demo:end
