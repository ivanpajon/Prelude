name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly dependency audit, also when nobody pushes.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 12 --ignore-unfixable only adds advisories without a patched release to this
      # checkout's pnpm-workspace.yaml ignore list and exits 0. The next step fails on the rest.
      - run: pnpm audit --prod --ignore-unfixable
      - run: pnpm audit --prod --audit-level high

  verify:
    name: Verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  stack:
    name: Docker stack
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The runner image ships an older Compose plugin; docs/docker.md lists the minimum.
      - name: Install Docker Compose 5.6.0
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL --retry 3 -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64
          echo "40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a  $HOME/.docker/cli-plugins/docker-compose" | sha256sum --check
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - run: pnpm test:stack
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-results
          path: test-results/stack
          if-no-files-found: ignore
          retention-days: 7

  # demo:start
  # Proves on every push that a project without the demo stays green.
  # pnpm remove-demo deletes this job together with the demo.
  demo-removal:
    name: Demo removal
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The runner image ships an older Compose plugin; docs/docker.md lists the minimum.
      - name: Install Docker Compose 5.6.0
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL --retry 3 -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64
          echo "40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a  $HOME/.docker/cli-plugins/docker-compose" | sha256sum --check
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      # The command does not commit, so the job needs no Git identity.
      - run: pnpm remove-demo
      - run: pnpm verify
      - run: pnpm test:stack
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-removal-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
  # demo:end
