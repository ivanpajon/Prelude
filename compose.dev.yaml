services:
  web:
    # A separate name keeps this image from replacing the production image.
    image: ${COMPOSE_PROJECT_NAME}-web-dev
    build:
      context: .
      target: development
    init: true
    environment:
      PORT: "${DEV_PORT:-3000}"
      MCP_INSPECTOR_PORT: "${MCP_INSPECTOR_PORT:-6274}"
      MCP_SANDBOX_PORT: "${MCP_SANDBOX_PORT:-6275}"
      MCP_ENABLED: "${MCP_ENABLED:-true}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
    # Keep the container's wildcard listeners reachable from this machine only.
    # Matching host/container ports preserve Inspector URLs and origin checks.
    ports:
      - "127.0.0.1:${DEV_PORT:-3000}:${DEV_PORT:-3000}"
      - "127.0.0.1:${MCP_INSPECTOR_PORT:-6274}:${MCP_INSPECTOR_PORT:-6274}"
      - "127.0.0.1:${MCP_SANDBOX_PORT:-6275}:${MCP_SANDBOX_PORT:-6275}"
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # The launcher skips the Inspector and its sandbox when MCP_ENABLED=false.
        - >-
          const probes = [[process.env.PORT, '/api/health', 'GET']];
          if (process.env.MCP_ENABLED?.trim().toLowerCase() !== 'false') probes.push(
          [process.env.MCP_INSPECTOR_PORT, '/', 'HEAD'], [process.env.MCP_SANDBOX_PORT, '/sandbox', 'GET']);
          Promise.all(probes.map(([port, path, method]) =>
          fetch('http://127.0.0.1:' + port + path, {method, signal: AbortSignal.timeout(4000)})
          .then(response => {if (!response.ok) throw new Error('Unhealthy development server')})))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    develop:
      watch:
        # On Windows a change directly inside a folder also reports the folder, and Compose (5.6.1)
        # then copies the whole folder without .dockerignore or `ignore`. So sync paths are folders
        # that never hold build output (.next, node_modules, sw.js): a new package's src or a new
        # top-level file or folder in public/ needs its own rule, and a deleted one must lose its
        # rule, because Watch does not start when a sync path is missing.
        - { action: sync, path: apps/web/src, target: /app/apps/web/src, initial_sync: true }
        - { action: sync, path: apps/web/public/branding, target: /app/apps/web/public/branding, initial_sync: true }
        - { action: sync, path: apps/web/public/icons, target: /app/apps/web/public/icons, initial_sync: true }
        - { action: sync, path: apps/web/public/favicon.ico, target: /app/apps/web/public/favicon.ico, initial_sync: true }
        - { action: sync, path: packages/api/src, target: /app/packages/api/src, initial_sync: true }
        - { action: sync, path: packages/contracts/src, target: /app/packages/contracts/src, initial_sync: true }
        - { action: sync, path: packages/i18n/src, target: /app/packages/i18n/src, initial_sync: true }
        - { action: sync, path: packages/temporal/src, target: /app/packages/temporal/src, initial_sync: true }
        - { action: sync, path: packages/ui/src, target: /app/packages/ui/src, initial_sync: true }
        # No folder matches these patterns, so `.` is safe here. No initial_sync: it skips `include`
        # and would copy the whole tree; `up --build` puts these files in the image instead.
        - action: sync+restart
          path: .
          target: /app
          include:
            - "scripts/dev-*.mjs"
            # demo:start
            - scripts/build-mcp-apps.mjs
            # demo:end
            - "apps/*/next.config.*"
            - "apps/*/postcss.config.*"
            - "**/tsconfig*.json"
        # Include every workspace manifest, including newly added packages.
        - action: rebuild
          path: .
          include:
            - "**/package.json"
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - Dockerfile
            - .dockerignore
