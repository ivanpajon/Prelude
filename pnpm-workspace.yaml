packages:
  - apps/*
  - packages/*

allowBuilds:
  # Published Inspector assets are prebuilt; its postinstall is for source checkouts.
  '@modelcontextprotocol/inspector': false
  # Tailwind CLI uses the published platform binaries, not a local node-gyp build.
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true

engineStrict: true

overrides:
  # @serwist/next 9.5.12 pins browserslist 4.28.6 (GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g).
  # 9.5.13 depends on ^4.29.3; this override stops matching once Renovate updates Serwist.
  '@serwist/next@9.5.12>browserslist': 4.29.3

saveExact: true
strictPeerDependencies: true
