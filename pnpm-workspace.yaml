packages:
  - apps/*
  - packages/*

allowBuilds:
  # Published Inspector assets are prebuilt; its postinstall is for source checkouts.
  '@modelcontextprotocol/inspector': false
  # The published platform binaries are used, not a local node-gyp build.
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true

auditConfig:
  # braces <=3.0.3 has no patched release (GHSA-vfj7-8cjw-p6xm: a stack overflow from deeply
  # nested brace patterns). Only build and development tools reach it, through micromatch: today
  # @parcel/watcher (the file watcher in next-intl) and fast-glob (in the shadcn CLI and ts-morph).
  # These paths can change with lockfile updates; run `pnpm why -r braces` to see them. When no
  # production dependency reaches it, `pnpm audit --prod` stops reporting it, but `pnpm audit`
  # still does. The glob patterns these tools use come from this repository, not from requests,
  # and the production image ships only the Next.js standalone output, which does not include
  # braces.
  # Remove this entry when a patched release ships.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

engineStrict: true

overrides:
  # @serwist/next 9.5.12 pins browserslist 4.28.6 (GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g).
  # 9.5.13 depends on ^4.29.3, so delete this override in the Serwist update pull request.
  '@serwist/next@9.5.12>browserslist': 4.29.3
  # Serwist pins zod exactly (9.5.12 pins 4.4.3, 9.5.13 pins 4.6.5), below the GHSA-mrhx-c7xc-m3w5
  # fix in 4.6.6. Delete these overrides when the Serwist release in use pins zod 4.6.6 or later.
  '@serwist/build>zod': 4.6.6
  '@serwist/cli>zod': 4.6.6
  '@serwist/next>zod': 4.6.6
  '@serwist/webpack-plugin>zod': 4.6.6

permissions:
  # Do not link the Inspector's agent skills, so installs under a coding agent do not ask for them.
  '@modelcontextprotocol/inspector':
    skills: false

saveExact: true
strictPeerDependencies: true
