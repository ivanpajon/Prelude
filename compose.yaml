services:
  web:
    build:
      context: .
      target: production
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${PROD_HOST:-127.0.0.1}:${PROD_PORT:-3001}:3000"
    environment:
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/offline', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      start_interval: 1s
      retries: 3
